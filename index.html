<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Unit Converter</title>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <main class="container">
            <!-- Purple header section  -->
            <div class="header"> 
                <h1 class="app-title">Metric/Imperial Unit Conversion</h1>
                <input type="number" id="input-value" class="input-field" placeholder="Enter value" value="20">
                <button id="convert-btn" class="convert-btn">Convert</button>
            </div>
            <!-- result cards section -->
            <div class="result">
                <div class="unit-card" id="length-card">
                    <h2 class="unit-heading">Length (Meter/Feet)</h2>
                    <p class="unit-result" id="length-result">20 meters = 65.616 feet | 20 feet = 6.096 meters</p>
                </div>
                <div class="unit-card" id="volume-card">
                    <h2 class="unit-heading">Volume (Liters/Gallons)</h2>
                    <p class="unit-result" id="volume-result">20 liters = 5.284 gallons | 20 gallons = 75.708 liters</p>
                </div>
                <div class="unit-card" id="mass-card">
                    <h2 class="unit-heading">Mass (Kilograms/Pounds)</h2>
                    <p class="unit-result" id="mass-result">20 kilos = 44.092 pounds | 20 pounds = 9.072 kilos</p>
                </div>                   
            </div>
        </main>
        <script src="index.js"></script>
    </body>
</html>
